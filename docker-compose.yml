services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bfa-hmi-backend
    expose:
      - "8000"
    environment:
      - PLC_HOST=${PLC_HOST:-192.168.1.100}
      - PLC_PORT=${PLC_PORT:-502}
      - MODBUS_UNIT_ID=${MODBUS_UNIT_ID:-1}
      - PLC_PROTO=${PLC_PROTO:-modbus}
      - POLL_MS=${POLL_MS:-500}
      - PLC_SIM=${PLC_SIM:-true}
      - LOG_DIR=/data
      - LOG_INTERVAL_S=${LOG_INTERVAL_S:-5}
      - DEBUG=${DEBUG:-false}
      # Licence enforcement (offline kill-switch)
      - LICENSE_ENFORCE=${LICENSE_ENFORCE:-true}
      - LICENSE_REQUIRE_MACHINE=${LICENSE_REQUIRE_MACHINE:-true}
      - MACHINE_ID=${MACHINE_ID:-}
    volumes:
      - ./backend:/app
      - ./data:/data
    restart: unless-stopped
    networks:
      - bfa-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bfa-hmi-frontend
    ports:
      - "5054:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bfa-network

networks:
  bfa-network:
    driver: bridge
