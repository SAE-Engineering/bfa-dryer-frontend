# SIM frontend nginx — serves the BFA HMI SPA under the /bfa/sim/ sub-path so
# it embeds on designs.sauer.com.au/bfa (the designpacks nginx reverse-proxies
# /bfa/sim/ here, path preserved).  Built with VITE_BASE=/bfa/sim/ so the SPA's
# assets + API/WS calls resolve under /bfa/sim/.
#
# Real-panel frontend (nginx.conf, base "/") is unaffected — this conf is only
# baked into the sim image.
server {
    listen 80;
    server_name _;

    # API → sim backend (strip the /bfa/sim prefix so backend sees /api/…)
    location /bfa/sim/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket → sim backend (live state stream)
    location /bfa/sim/ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static SPA under /bfa/sim/ — alias strips the prefix, SPA fallback to the
    # built index.html (also under the sub-path so its asset refs stay correct).
    location /bfa/sim/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /bfa/sim/index.html;
    }

    # Bare /bfa/sim (no trailing slash) → canonical trailing-slash form.
    location = /bfa/sim {
        return 301 /bfa/sim/;
    }
}
